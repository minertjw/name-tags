[project]
name = "nametags"
version = "0.1.0"
description = "Event name tag generation for UONES"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "Flask==3.1.*",
    "pillow==12.1.*",
    "reportlab==4.4.*",
    "pywebview[ssl]==6.2.*",
]

[dependency-groups]
dev = [
    "pytest",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nametags"]

[tool.hatch.build]
include = [
    "src/nametags/assets/**/*",
]
